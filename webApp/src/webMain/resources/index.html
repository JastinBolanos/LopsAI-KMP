<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>LopsAI-KMP</title>
    <link type="text/css" rel="stylesheet" href="styles.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Elimina cualquier barra de scroll fea del navegador */
            background-color: #16161C; /* Opcional: fondo oscuro base mientras carga */

            /* Centrado del spinner con Flexbox para mayor compatibilidad */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Forzamos al Canvas de Compose a ocupar 100% sin deformarse */
        canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
            outline: none;
            position: absolute; /* Se superpone al spinner al terminar de cargar */
            z-index: 10;
        }

        /* Mantenemos tu spinner de carga en el fondo */
        svg {
            position: absolute;
            z-index: 1;
        }
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
    </circle>
</svg>

<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
